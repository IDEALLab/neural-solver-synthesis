[project]
name = "llm-finetuning"
version = "0.1.0"
description = "LLM fine-tuning for engineering design tasks with simulator-based evaluation"
authors = [
    {name = "Soheyl Massoudi", email = "smassoudi@ethz.ch"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core dependencies for simulators and evaluation
    "numpy>=1.24.0,<=1.26.4",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    # Plotting and visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0,<=0.13.2",
    "scipy>=1.10.0,<=1.16.3",
    # Pandas styling support
    "jinja2>=3.1.0",
    # Hugging Face for datasets and model hub
    "datasets>=2.14.0",
    "huggingface_hub>=0.16.0",
    "python-dotenv>=1.0.0",
    # Token counting for LLM datasets
    "tiktoken>=0.12.0",
    # syndeopt for SDS problems (installed as editable from deps/syndeopt)
    # open-r1 for simulators (installed as editable from deps/open-r1)
]

[project.optional-dependencies]
dev = [
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/SoheylM/llm-finetuning"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Include evaluation and data packages
packages = ["evaluation", "data"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yaml", "*.yml"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "deps",
    "*.egg-info",
]

# Same as Black.
line-length = 88

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = [
    "E4",   # pycodestyle errors
    "E7",   # pycodestyle errors
    "E9",   # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "NPY",  # numpy
    "PERF", # perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
    "RUF",  # Ruff-specific rules
    "AIR",  # airflow
]

ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["evaluation", "data"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]
# Allow print statements in scripts
"scripts/**/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",  # Show extra test summary info
    "--strict-markers",  # Treat unregistered markers as errors
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
files = ["evaluation/", "data/"]
exclude = [
  "^build/",
  "^deps/",
  "^scripts/",
  "^manuscript/",
  "^tests/",
  "^archive/",
]

[[tool.mypy.overrides]]
module = [
  "syndeopt.*",
  "open_r1.*",
]
ignore_missing_imports = true

