# Model arguments
model_name_or_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-14B
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: IDEALLab/OpenR1-EPS-5k
dataset_prompt_column: problem
system_prompt: "You are an expert reasoning assistant. Always break your reasoning into clear steps within a <think>...</think> block before responding in the <answer>...</answer> block."

# GRPO trainer config
bf16: true
use_vllm: true
do_eval: false
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_model_id: DeepSeek-R1-Distill-Qwen-14B-EPS-GRPO
hub_strategy: every_save
learning_rate: 1.0e-06
log_completions: true
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
max_prompt_length: 1024
max_completion_length: 4096
max_steps: -1
num_generations: 4
num_train_epochs: 1
output_dir: data/DeepSeek-R1-Distill-Qwen-14B-EPS-GRPO
overwrite_output_dir: true
per_device_eval_batch_size: 4
per_device_train_batch_size: 4
push_to_hub: true
report_to:
- wandb
reward_funcs:
- eps_format
- eps_simulator
reward_weights:
- 1.0
- 1.0
save_strategy: "epoch"
save_total_limit: 1
seed: 42
temperature: 0.7
use_liger_kernel: true
warmup_ratio: 0.1

# Environment variables for EPS simulator
# Make sure to set SIMULATOR_URL in your environment or .env file
# export SIMULATOR_URL=http://localhost:8001 